<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register New Patient</title>
<link rel="stylesheet" href="RegisterNP.css">
</head>
<body>

  <div class="modal">

    <button class="close-btn" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L19 19M19 1L1 19" stroke="white" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="modal-header">
      <h1>Register New Patient</h1>
      <p class="step-label">Step 1 of 3: Personal Details</p>
    </div>

    <form class="reg-form">

      <div class="form-row">
        <div class="form-field">
          <label for="firstName">First Name <span class="required">*</span></label>
          <input type="text" id="firstName" name="firstName" value="Babatunde" required>
        </div>
        <div class="form-field">
          <label for="lastName">Last Name <span class="required">*</span></label>
          <input type="text" id="lastName" name="lastName" value="Adeniji" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="dob">Date of Birth <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <input type="text" id="dob" name="dob" value="15/12/1990" required>
            <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2.5" y="3.5" width="15" height="14" rx="2" stroke="#1D6FE0" stroke-width="1.5"/>
              <path d="M2.5 7.5H17.5" stroke="#1D6FE0" stroke-width="1.5"/>
              <path d="M6 1.5V4.5" stroke="#1D6FE0" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M14 1.5V4.5" stroke="#1D6FE0" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="form-field">
          <label for="gender">Gender <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <select id="gender" name="gender" required>
              <option value="Male" selected>Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <svg class="input-icon" width="16" height="10" viewBox="0 0 16 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1.5L8 8.5L15 1.5" stroke="#0d0d0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="phone">Phone Number <span class="required">*</span></label>
          <input type="tel" id="phone" name="phone" value="08123456789" required>
        </div>
        <div class="form-field">
          <label for="email">Email (Optional)</label>
          <input type="email" id="email" name="email" value="ade.b@gmail.com">
        </div>
      </div>

      <div class="form-row form-row-full">
        <div class="form-field">
          <label for="guardian" class="label-muted">Parent/Guardian Contact (for &lt;18yrs)</label>
          <input type="text" id="guardian" name="guardian" placeholder="Name and phone number">
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="continue-btn">Continue</button>
      </div>

    </form>

  </div>

  <script src="popup.js"></script>
</body>
</html>
