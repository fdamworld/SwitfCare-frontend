<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Profile</title>
<link rel="stylesheet" href="PatientPr.css">
</head>
<body>

  <div class="modal-overlay">
    <div class="modal">

      <button class="close-btn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L19 19M19 1L1 19" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="modal-header">
        <h1>Patient Profile</h1>
        <p>Select the correct patient profile</p>
      </div>

      <div class="profile-card">
        <div class="profile-top">
          <div class="profile-avatar">
            <img src="" alt="Adeoye Oyewale">
          </div>
          <div class="profile-name">
            <h2>Adeoye Oyewale</h2>
            <p>Patient ID: <span class="value">SWC-00012345</span></p>
          </div>
        </div>

        <hr>

        <div class="profile-details">
          <div class="detail-row">
            <span class="label">Phone Number</span>
            <span class="value">08123456789</span>
          </div>
          <div class="detail-row">
            <span class="label">Email</span>
            <span class="value">adeoye.o@gmail.com</span>
          </div>
          <div class="detail-row">
            <span class="label">Date of Birth</span>
            <span class="value">16 March 1990 (34yrs)</span>
          </div>
          <div class="detail-row">
            <span class="label">Gender</span>
            <span class="value">Male</span>
          </div>
          <div class="detail-row">
            <span class="label">Address</span>
            <span class="value">12, Ademola Avenue, Ikeja, Lagos</span>
          </div>
          <div class="detail-row">
            <span class="label">Last Visit</span>
            <span class="value">13 June 2024</span>
          </div>
        </div>
      </div>

      <div class="footer-row">
        <button class="select-btn">Select this patient</button>
      </div>

    </div>
  </div>

</body>
</html>
