<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Patient</title>
    <link rel="stylesheet" href="SearchP.css">
</head>
<body>
    <div class="modal-overlay">
        <div class="Patient-management-search">
            <button class="close-btn" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L19 19M19 1L1 19" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </button>

            <h2>Patient Management</h2>
            <p class="subtitle">Register, Search, view and manage patient records</p>

            <div class="search-row">
                <input type="search" class="search-p" placeholder="Search patient by name, phone number or ID">
                <button class="search-pt">Search patient</button>
            </div>

            <div class="reg-patient">
                <button class="reg-new-patient">Register New Patient</button>
                <p>Add a new patient to the system</p>
            </div>
        </div>
    </div>
</body>
</html>
